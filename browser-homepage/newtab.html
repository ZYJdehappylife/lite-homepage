<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻主页</title>
<style>
/* ==========================================================================
   轻主页 Lite New Tab
   All tunable visual values are CSS custom properties written by app.js.
   ========================================================================== */

:root {
  /* background layer */
  --bg-blur: 0px;
  --bg-bright: 1;
  --bg-scale: 1;
  --bg-overlay: 0.28;
  --overlay-tint: 0, 0, 0;

  /* glass */
  --glass-blur: 22px;
  --glass-alpha: 0.22;
  --glass-tint: 255, 255, 255;
  --glass-sat: 160%;
  --glass-radius: 22px;
  --glass-border: 0.18;
  --glass-shadow: 0.24;

  /* text */
  --fg: #ffffff;
  --fg-dim: rgba(255, 255, 255, 0.62);
  --fg-line: rgba(255, 255, 255, 0.16);

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ui-font: system-ui, -apple-system, "Segoe UI", "PingFang SC",
             "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: var(--ui-font);
  color: var(--fg);
  background: #0b1020;
  -webkit-font-smoothing: antialiased;
}

body.dragging,
body.resizing { user-select: none; cursor: default; }

button, input, select, textarea { font-family: inherit; }

/* ------------------------------------------------------------------ layers */
#bg {
  position: fixed;
  inset: -3%;
  z-index: 0;
  background-color: #0b1020;
  /* fallback / "pure colour" backdrop — also used when the bing API is unreachable */
  background-image:
    radial-gradient(90% 70% at 15% 8%, rgba(99, 102, 241, .60), transparent 60%),
    radial-gradient(80% 70% at 86% 18%, rgba(168, 85, 247, .48), transparent 62%),
    radial-gradient(95% 80% at 62% 102%, rgba(14, 165, 233, .42), transparent 66%),
    linear-gradient(160deg, #0a0f22 0%, #171233 52%, #241a3d 100%);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(var(--bg-blur)) brightness(var(--bg-bright));
  transform: scale(var(--bg-scale));
  transition: filter .45s var(--ease), transform .6s var(--ease),
              background-image .5s var(--ease);
}

#bg-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0) 35%, rgba(var(--overlay-tint), calc(var(--bg-overlay) * .7)) 100%),
    rgba(var(--overlay-tint), var(--bg-overlay));
  transition: background .35s var(--ease);
}

/* ------------------------------------------------------------------- stage */
#stage {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 32px 32px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.28) transparent;
}
#stage::-webkit-scrollbar { width: 10px; }
#stage::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.22); border-radius: 99px;
  border: 3px solid transparent; background-clip: content-box;
}

/* ------------------------------------------------------------------- clock */
#clock {
  margin-top: 14vh;
  text-align: center;
  transition: margin .4s var(--ease), opacity .3s var(--ease);
  text-shadow: 0 2px 24px rgba(0,0,0,.35);
}
body.mode-minimal #clock { margin-top: 22vh; }
#clock .time {
  font-size: 72px;
  font-weight: 200;
  letter-spacing: -.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
#clock .date {
  margin-top: 10px;
  font-size: 15px;
  letter-spacing: .16em;
  color: var(--fg-dim);
  text-transform: uppercase;
}
body.hide-clock #clock { display: none; }
body.hide-date #clock .date { display: none; }

/* ------------------------------------------------------------ search field */
#search-wrap {
  width: min(var(--search-width, 640px), 100%);
  margin-top: 34px;
  transition: margin .4s var(--ease), opacity .3s var(--ease);
}
body.mode-minimal #search-wrap { margin-top: 0; }

.glass {
  background: rgba(var(--glass-tint), var(--glass-alpha));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid rgba(255, 255, 255, var(--glass-border));
  box-shadow:
    0 18px 50px -12px rgba(0, 0, 0, var(--glass-shadow)),
    inset 0 1px 0 rgba(255, 255, 255, calc(var(--glass-border) * .9));
}
body.no-glass .glass {
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  background: rgba(var(--glass-tint), calc(var(--glass-alpha) + .28));
}

#search-form {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 58px;
  padding: 0 10px 0 22px;
  border-radius: var(--search-radius, 999px);
}
#search-form .icon {
  flex: none; width: 20px; height: 20px;
  opacity: .72;
}
#search-form .icon svg { display: block; width: 100%; height: 100%; }

#search-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--fg);
  font-size: 16.5px;
  letter-spacing: .01em;
}
#search-input::placeholder { color: var(--fg-dim); }

#search-go {
  flex: none;
  height: 42px;
  padding: 0 20px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  box-shadow: 0 6px 18px -6px rgba(99, 102, 241, .9);
  transition: transform .18s var(--ease), filter .18s var(--ease);
}
#search-go:hover { transform: translateY(-1px); filter: brightness(1.08); }
#search-go:active { transform: translateY(0) scale(.97); }

#engines {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
body.hide-engines #engines { display: none; }
#engines button {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.20);
  background: rgba(var(--glass-tint), calc(var(--glass-alpha) * .7));
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  color: var(--fg-dim);
  font-size: 12.5px;
  cursor: pointer;
  transition: all .2s var(--ease);
}
#engines button:hover { color: var(--fg); border-color: rgba(255,255,255,.38); }
#engines button.on {
  color: #fff;
  border-color: transparent;
  background: linear-gradient(135deg, #6366f1, #a855f7);
}

/* ------------------------------------------------------------------ groups */
#groups-wrap {
  width: 100%;
  max-width: 1400px;
  margin-top: 52px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: center;
  gap: 22px;
  padding-bottom: 90px;
}
body.mode-minimal #groups-wrap { display: none; }

.group {
  position: relative;
  width: 320px;
  padding: 18px 18px 20px;
  border-radius: var(--group-radius, 22px);
  transition: box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.group.size-locked { height: auto; }

.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--fg-line);
}
.group-head .title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.group-head .count {
  flex: none;
  font-size: 11px;
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
}
.group-head .tools {
  flex: none;
  display: none;
  gap: 4px;
}
body.editing .group-head .tools { display: flex; }
.group-head .tools button {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border: 0; border-radius: 7px;
  background: rgba(255,255,255,.10);
  color: var(--fg); cursor: pointer; font-size: 12px; line-height: 1;
  transition: background .16s var(--ease);
}
.group-head .tools button:hover { background: rgba(255,255,255,.24); }
.group-head .tools button.danger:hover { background: rgba(239,68,68,.65); }
.group-head .grip {
  flex: none; cursor: grab; padding: 0 2px;
  opacity: 0; font-size: 13px; line-height: 1;
  color: var(--fg-dim); transition: opacity .16s;
}
body.editing .group-head .grip { opacity: .7; }
.group-head .grip:active { cursor: grabbing; }

.links {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 14px;
}

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 66px;
  text-decoration: none;
  color: var(--fg);
  cursor: pointer;
  transition: transform .2s var(--ease);
}
.tile:hover { transform: translateY(-4px); }
body.editing .tile { cursor: grab; }

.tile .box {
  position: relative;
  width: 66px; height: 66px;
  display: grid;
  place-items: center;
  border-radius: var(--tile-radius, 18px);
  background: rgba(var(--tile-tint, 255,255,255), var(--tile-alpha, .18));
  border: 1px solid rgba(255,255,255, calc(var(--glass-border) * .8));
  -webkit-backdrop-filter: blur(calc(var(--glass-blur) * .6));
  backdrop-filter: blur(calc(var(--glass-blur) * .6));
  box-shadow: 0 8px 22px -10px rgba(0,0,0,.6);
  overflow: visible;
  transition: border-radius .18s var(--ease), background .18s var(--ease);
}
body.no-glass .tile .box { -webkit-backdrop-filter: none; backdrop-filter: none; }
.tile .fav {
  width: 52%; height: 52%;
  object-fit: contain;
  border-radius: 4px;
  pointer-events: none;
}
.tile .fallback {
  display: none;
  font-size: 22px; font-weight: 600;
  color: rgba(255,255,255,.94);
  text-shadow: 0 1px 4px rgba(0,0,0,.4);
}
.tile.no-icon .fav { display: none; }
.tile.no-icon .fallback { display: block; }
.tile .label {
  max-width: 100%;
  font-size: 12px;
  line-height: 1.3;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 6px rgba(0,0,0,.5);
  color: var(--fg);
}
body.hide-labels .tile .label { display: none; }

.tile .tools {
  position: absolute;
  top: -9px; left: -9px;
  display: none;
  gap: 3px;
  z-index: 4;
}
body.editing .tile .tools { display: flex; }
.tile .tools button {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border: 0; border-radius: 6px;
  background: rgba(15,23,42,.82);
  color: #fff; cursor: pointer; font-size: 11px; line-height: 1;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.tile .tools button:hover { background: #6366f1; }
.tile .tools button.danger:hover { background: #ef4444; }

.tile.add .box {
  border-style: dashed;
  border-color: rgba(255,255,255,.42);
  background: rgba(255,255,255,.06);
  font-size: 24px; font-weight: 300;
  color: var(--fg-dim);
}
.tile.add { display: none; }
body.editing .tile.add { display: flex; }
body.editing .tile.add:hover { transform: translateY(-4px) scale(1.04); }

/* drop feedback */
.group.drop-over {
  border-color: rgba(139, 92, 246, .95) !important;
  box-shadow: 0 0 0 2px rgba(139, 92, 246, .55), 0 18px 50px -12px rgba(0,0,0,.4) !important;
}
.tile.drop-before::before {
  content: "";
  position: absolute;
  left: -8px; top: 0; bottom: 0;
  width: 2px; border-radius: 2px;
  background: #a855f7;
}
.group.dragging, .tile.dragging { opacity: .35; }

#add-group {
  display: none;
  width: 320px;
  min-height: 108px;
  border: 1px dashed rgba(255,255,255,.30);
  border-radius: var(--glass-radius);
  background: rgba(255,255,255,.05);
  color: var(--fg-dim);
  font-size: 13px;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: all .2s var(--ease);
}
body.editing.mode-bookmarks #add-group { display: block; }
#add-group:hover {
  color: var(--fg);
  border-color: rgba(255,255,255,.6);
  background: rgba(255,255,255,.12);
}

/* ------------------------------------------------------- resize / radius UI */
.rh {
  position: absolute;
  display: none;
  z-index: 6;
  touch-action: none;
}
body.editing .rh { display: block; }

.rh-size {
  right: -7px; bottom: -7px;
  width: 16px; height: 16px;
  border-radius: 5px;
  background: #6366f1;
  border: 2px solid rgba(255,255,255,.92);
  cursor: nwse-resize;
  box-shadow: 0 2px 8px rgba(0,0,0,.45);
}
.rh-radius {
  right: -7px; top: -7px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #22d3ee;
  border: 2px solid rgba(255,255,255,.92);
  cursor: ew-resize;
  box-shadow: 0 2px 8px rgba(0,0,0,.45);
}
.tile .rh-size, .tile .rh-radius { width: 14px; height: 14px; }

.rh-hint {
  position: absolute;
  z-index: 20;
  padding: 4px 9px;
  border-radius: 8px;
  background: rgba(15, 23, 42, .92);
  color: #fff;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, -140%);
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
}

/* ---------------------------------------------------------------- top right */
#topbar {
  position: fixed;
  top: 18px; right: 20px;
  z-index: 30;
  display: flex;
  gap: 8px;
  opacity: .18;
  transition: opacity .3s var(--ease);
}
#topbar:hover, body.editing #topbar { opacity: 1; }
.tb-btn {
  height: 36px;
  min-width: 36px;
  padding: 0 13px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(var(--glass-tint), calc(var(--glass-alpha) + .06));
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  backdrop-filter: blur(16px) saturate(140%);
  color: var(--fg);
  font-size: 12.5px;
  cursor: pointer;
  box-shadow: 0 8px 24px -10px rgba(0,0,0,.5);
  transition: all .2s var(--ease);
}
.tb-btn:hover { background: rgba(255,255,255,.22); transform: translateY(-1px); }
.tb-btn.on {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, #6366f1, #a855f7);
}
.tb-btn svg { width: 15px; height: 15px; display: block; }

/* ---------------------------------------------------------- settings drawer */
#panel {
  position: fixed;
  top: 0; right: 0;
  z-index: 40;
  width: 372px;
  max-width: 92vw;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: rgba(17, 20, 34, .78);
  -webkit-backdrop-filter: blur(30px) saturate(170%);
  backdrop-filter: blur(30px) saturate(170%);
  border-left: 1px solid rgba(255,255,255,.14);
  color: #f1f5f9;
  transform: translateX(102%);
  transition: transform .38s var(--ease);
  box-shadow: -30px 0 70px -30px rgba(0,0,0,.75);
}
#panel.open { transform: translateX(0); }

#panel .p-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.10);
}
#panel .p-head h2 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: .04em; }
#panel .p-head button {
  width: 28px; height: 28px; border: 0; border-radius: 8px;
  background: rgba(255,255,255,.10); color: #f1f5f9;
  cursor: pointer; font-size: 15px; line-height: 1;
}
#panel .p-head button:hover { background: rgba(255,255,255,.22); }

#panel .p-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 20px 40px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.24) transparent;
}
#panel .p-body::-webkit-scrollbar { width: 8px; }
#panel .p-body::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.22); border-radius: 99px;
  border: 2px solid transparent; background-clip: content-box;
}

.sec { margin-bottom: 26px; }
.sec > h3 {
  margin: 0 0 13px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #a5b4fc;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 34px;
  margin-bottom: 11px;
}
.row > label {
  flex: 1 1 auto;
  font-size: 13px;
  color: #cbd5e1;
}
.row .val {
  flex: none;
  min-width: 46px;
  text-align: right;
  font-size: 11.5px;
  color: #94a3b8;
  font-variant-numeric: tabular-nums;
}
.row.col { display: block; }
.row.col > label { display: block; margin-bottom: 8px; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 168px;
  height: 22px;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 99px; background: rgba(255,255,255,.18);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 15px; height: 15px; margin-top: -5.5px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid #6366f1;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}

select, input[type="text"], input[type="url"] {
  height: 34px;
  min-width: 0;
  padding: 0 11px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.07);
  color: #f1f5f9;
  font-size: 13px;
  outline: none;
  transition: border-color .18s, background .18s;
}
select:focus, input[type="text"]:focus, input[type="url"]:focus {
  border-color: #818cf8; background: rgba(255,255,255,.12);
}
select option { background: #1a1f33; color: #f1f5f9; }
input.full, select.full { width: 100%; }

input[type="color"] {
  -webkit-appearance: none;
  appearance: none;
  width: 46px; height: 28px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 5px; }

.sw {
  flex: none;
  position: relative;
  width: 40px; height: 22px;
  border-radius: 99px;
  background: rgba(255,255,255,.18);
  cursor: pointer;
  transition: background .22s var(--ease);
}
.sw::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform .22s var(--ease);
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
}
.sw.on { background: #6366f1; }
.sw.on::after { transform: translateX(18px); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button, .btn {
  height: 32px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.07);
  color: #e2e8f0;
  font-size: 12.5px;
  cursor: pointer;
  transition: all .18s var(--ease);
}
.chips button:hover, .btn:hover { background: rgba(255,255,255,.18); }
.chips button.on {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, #6366f1, #a855f7);
}
.btn.wide { width: 100%; }
.btn.primary {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, #6366f1, #a855f7);
}
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: #fca5a5; border-color: rgba(248,113,113,.4); }
.btn.danger:hover { background: rgba(239,68,68,.28); }

.hint {
  margin: 8px 0 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: #7f8ea8;
}

/* ------------------------------------------------------------------- modal */
#modal-mask {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  place-items: center;
  background: rgba(6, 9, 18, .55);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
#modal-mask.open { display: grid; }

#modal {
  width: 400px;
  max-width: 90vw;
  max-height: 86vh;
  overflow-y: auto;
  padding: 24px;
  border-radius: 20px;
  background: rgba(22, 26, 42, .94);
  border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.8);
  color: #f1f5f9;
  animation: pop .26s var(--ease);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(14px) scale(.97); }
  to   { opacity: 1; transform: none; }
}
#modal h3 { margin: 0 0 18px; font-size: 15.5px; font-weight: 600; }
#modal .field { margin-bottom: 14px; }
#modal .field > span {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  color: #94a3b8;
}
#modal .field input { width: 100%; }
#modal .actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 22px;
}

/* ------------------------------------------------------------------- toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 34px;
  z-index: 60;
  padding: 10px 20px;
  border-radius: 99px;
  background: rgba(15, 23, 42, .93);
  color: #fff;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 14px);
  transition: all .3s var(--ease);
  box-shadow: 0 14px 40px -12px rgba(0,0,0,.7);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* -------------------------------------------------------------- responsive */
@media (max-width: 720px) {
  #stage { padding: 0 16px 24px; }
  #clock .time { font-size: 52px; }
  #clock { margin-top: 12vh; }
  .group { width: 100%; }
  #add-group { width: 100%; }
  #topbar { opacity: .9; }
}
</style>
</head>
<body class="mode-bookmarks">

<!-- background -->
<div id="bg"></div>
<div id="bg-overlay"></div>

<!-- top-right controls -->
<div id="topbar">
  <button class="tb-btn" id="tb-mode" title="切换极简 / 收藏夹模式 (Ctrl+M)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    </svg>
    <span id="tb-mode-label">收藏夹</span>
  </button>
  <button class="tb-btn" id="tb-edit" title="编辑模式 (Ctrl+E)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
    <span>编辑</span>
  </button>
  <button class="tb-btn" id="tb-settings" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
    </svg>
    <span>设置</span>
  </button>
</div>

<!-- main stage -->
<div id="stage">
  <header id="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date" id="clock-date"></div>
  </header>

  <section id="search-wrap">
    <form id="search-form" class="glass" autocomplete="off">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </span>
      <input id="search-input" type="text" placeholder="搜索或输入网址" spellcheck="false">
      <button id="search-go" type="submit">搜索</button>
    </form>
    <div id="engines"></div>
  </section>

  <section id="groups-wrap">
    <button id="add-group">＋ 新建分组</button>
  </section>
</div>

<!-- settings drawer -->
<aside id="panel">
  <div class="p-head">
    <h2>设置</h2>
    <button id="panel-close" title="关闭">✕</button>
  </div>
  <div class="p-body">

    <div class="sec">
      <h3>背景</h3>
      <div class="row">
        <label>壁纸来源</label>
        <select data-bind="background.source" style="width:150px">
          <option value="bing">必应每日壁纸</option>
          <option value="url">图片链接</option>
          <option value="upload">本地上传</option>
          <option value="color">纯色 / 渐变</option>
        </select>
      </div>
      <div class="row col" data-show-if="background.source=url">
        <label>图片链接</label>
        <input type="url" class="full" data-bind="background.url"
               placeholder="https://example.com/photo.jpg">
      </div>
      <div class="row col" data-show-if="background.source=upload">
        <label>本地图片</label>
        <input type="file" id="bg-file" accept="image/*" class="full"
               style="font-size:12px;color:#94a3b8">
      </div>
      <div class="row">
        <label>纯色底色</label>
        <input type="color" data-bind="background.color">
      </div>
      <div class="row">
        <label>模糊</label>
        <input type="range" data-bind="background.blur" min="0" max="40" step="1">
        <span class="val" data-val="background.blur"></span>
      </div>
      <div class="row">
        <label>亮度</label>
        <input type="range" data-bind="background.brightness" min="20" max="150" step="1">
        <span class="val" data-val="background.brightness"></span>
      </div>
      <div class="row">
        <label>遮罩深浅</label>
        <input type="range" data-bind="background.overlay" min="0" max="85" step="1">
        <span class="val" data-val="background.overlay"></span>
      </div>
      <div class="row">
        <label>缩放</label>
        <input type="range" data-bind="background.zoom" min="100" max="130" step="1">
        <span class="val" data-val="background.zoom"></span>
      </div>
      <div class="row">
        <label>填充方式</label>
        <select data-bind="background.fit" style="width:110px">
          <option value="cover">裁剪铺满</option>
          <option value="contain">完整显示</option>
          <option value="repeat">平铺</option>
        </select>
      </div>
      <div class="row">
        <label>打开时刷新必应壁纸</label>
        <div class="sw" data-bind="background.refreshDaily"></div>
      </div>
      <div class="chips">
        <button class="btn" data-bg-random>换一张必应壁纸</button>
      </div>
    </div>

    <div class="sec">
      <h3>毛玻璃 / 磨砂</h3>
      <div class="row">
        <label>启用玻璃效果</label>
        <div class="sw" data-bind="glass.enabled"></div>
      </div>
      <div class="row">
        <label>模糊强度</label>
        <input type="range" data-bind="glass.blur" min="0" max="60" step="1">
        <span class="val" data-val="glass.blur"></span>
      </div>
      <div class="row">
        <label>透明度</label>
        <input type="range" data-bind="glass.alpha" min="0" max="80" step="1">
        <span class="val" data-val="glass.alpha"></span>
      </div>
      <div class="row">
        <label>色彩饱和</label>
        <input type="range" data-bind="glass.saturate" min="100" max="300" step="5">
        <span class="val" data-val="glass.saturate"></span>
      </div>
      <div class="row">
        <label>玻璃色调</label>
        <input type="color" data-bind="glass.tint">
      </div>
      <div class="row">
        <label>圆角</label>
        <input type="range" data-bind="glass.radius" min="0" max="36" step="1">
        <span class="val" data-val="glass.radius"></span>
      </div>
      <div class="row">
        <label>描边高光</label>
        <input type="range" data-bind="glass.border" min="0" max="60" step="1">
        <span class="val" data-val="glass.border"></span>
      </div>
      <div class="row">
        <label>投影</label>
        <input type="range" data-bind="glass.shadow" min="0" max="80" step="1">
        <span class="val" data-val="glass.shadow"></span>
      </div>
      <div class="chips" id="glass-presets">
        <button data-preset="clear">清透</button>
        <button data-preset="frost">磨砂</button>
        <button data-preset="acrylic">亚克力</button>
        <button data-preset="liquid">液态</button>
        <button data-preset="none">关闭</button>
      </div>
    </div>

    <div class="sec">
      <h3>搜索</h3>
      <div class="row">
        <label>默认引擎</label>
        <select data-bind="search.engine" style="width:150px">
          <option value="bing">必应</option>
          <option value="baidu">百度</option>
          <option value="google">Google</option>
          <option value="sogou">搜狗</option>
          <option value="so360">360</option>
          <option value="ddg">DuckDuckGo</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="row col" data-show-if="search.engine=custom">
        <label>自定义地址（用 %s 代表关键词）</label>
        <input type="text" class="full" data-bind="search.customUrl"
               placeholder="https://example.com/search?q=%s">
      </div>
      <div class="row col">
        <label>占位文字</label>
        <input type="text" class="full" data-bind="search.placeholder">
      </div>
      <div class="row">
        <label>搜索栏宽度</label>
        <input type="range" data-bind="search.width" min="380" max="980" step="10">
        <span class="val" data-val="search.width"></span>
      </div>
      <div class="row">
        <label>搜索栏圆角</label>
        <input type="range" data-bind="search.radius" min="0" max="999" step="1">
        <span class="val" data-val="search.radius"></span>
      </div>
      <div class="row">
        <label>显示引擎快捷切换</label>
        <div class="sw" data-bind="search.showEngines"></div>
      </div>
    </div>

    <div class="sec">
      <h3>界面</h3>
      <div class="row">
        <label>显示时钟</label>
        <div class="sw" data-bind="ui.showClock"></div>
      </div>
      <div class="row">
        <label>显示日期</label>
        <div class="sw" data-bind="ui.showDate"></div>
      </div>
      <div class="row">
        <label>显示图标名称</label>
        <div class="sw" data-bind="ui.showLabels"></div>
      </div>
      <div class="row">
        <label>文字明暗</label>
        <select data-bind="ui.textTheme" style="width:110px">
          <option value="light">浅色文字</option>
          <option value="dark">深色文字</option>
        </select>
      </div>
      <div class="row col">
        <label>图标默认尺寸</label>
        <input type="range" data-bind="ui.iconSize" min="40" max="120" step="2">
        <span class="val" data-val="ui.iconSize"></span>
      </div>
      <div class="row col">
        <label>分组默认宽度</label>
        <input type="range" data-bind="ui.groupWidth" min="220" max="600" step="10">
        <span class="val" data-val="ui.groupWidth"></span>
      </div>
    </div>

    <div class="sec">
      <h3>数据</h3>
      <div class="chips" style="margin-bottom:10px">
        <button class="btn" id="data-export">导出配置</button>
        <button class="btn" id="data-import">导入配置</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
      <div class="chips">
        <button class="btn" id="data-clear">清空全部收藏</button>
        <button class="btn danger" id="data-reset">恢复默认</button>
      </div>
      <p class="hint">
        编辑模式下：拖动分组右上角 <b>灰色手柄</b> 排序分组；拖动图标可跨分组移动。
        拖动 <b style="color:#6366f1">紫色方块</b> 调整大小，拖动
        <b style="color:#22d3ee">青色圆点</b> 调整圆角。
      </p>
    </div>

  </div>
</aside>

<!-- modal -->
<div id="modal-mask">
  <div id="modal"></div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
